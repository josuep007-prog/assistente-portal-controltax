<div class="app">
  <header class="mast">
    <div class="logo"><img src="../icons/logo.svg" alt=""></div>
    <div class="ttl">
      <h1>Assistente do Portal</h1>
      <div class="emp" id="empresa">ControlTax</div>
    </div>
    <div class="acts">
      <button class="icon-btn" id="btn-plat" type="button" aria-label="Abrir a plataforma em tela cheia" title="Tela cheia"><svg class="ic"><use href="#i-expand"/></svg></button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="Alternar tema claro/escuro"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="btn-config" type="button" aria-label="Configurações"><svg class="ic"><use href="#i-gear"/></svg></button>
      <button class="icon-btn" id="btn-close" type="button" aria-label="Fechar o assistente"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Seções do assistente">
    <button class="tab" role="tab" data-view="inicio" aria-selected="true"><svg class="ic"><use href="#i-home"/></svg>Início</button>
    <button class="tab" role="tab" data-view="preencher" aria-selected="false"><svg class="ic"><use href="#i-fill"/></svg>Preencher<span class="dot" id="dot-preencher" hidden></span></button>
    <button class="tab" role="tab" data-view="pendencias" aria-selected="false"><svg class="ic"><use href="#i-bell"/></svg>Pendências<span class="dot" id="dot-pend" hidden></span></button>
    <button class="tab" role="tab" data-view="ferramentas" aria-selected="false"><svg class="ic"><use href="#i-calc"/></svg>Calcular</button>
    <button class="tab" role="tab" data-view="historico" aria-selected="false"><svg class="ic"><use href="#i-clock"/></svg>Agenda</button>
  </nav>

  <main class="view" id="view" tabindex="-1" aria-live="polite"></main>

  <footer class="foot">
    <svg class="ic ic-sm"><use href="#i-lock"/></svg><span>Arquivos lidos só no seu computador</span>
    <span class="sp"></span><span class="mono" id="rules-ver"></span>
  </footer>
</div>

<!-- Plataforma (2.0): tela cheia por cima do portal, no estilo do módulo DP do Control Hub -->
<div class="plat" id="plat" hidden>
  <nav class="rail" id="rail" aria-label="Módulos">
    <div class="rail-brand"><span class="rail-logo"><img src="../icons/logo.svg" alt=""></span><div class="rail-brand-tx"><b>Control<span>Tax</span></b><small>Portal do Cliente</small></div></div>
    <div class="rail-list" id="rail-mods"></div>
    <div class="rail-sep"></div>
    <div class="rail-list rail-bottom" id="rail-bottom"></div>
  </nav>
  <div class="plat-main">
    <header class="plat-head">
      <div class="ph-t"><h2 id="plat-titulo">Painel</h2><span class="ph-emp" id="plat-empresa"></span></div>
      <span class="ph-sync" id="plat-sync"></span>
      <button type="button" class="ph-search" id="plat-busca"><svg class="ic ic-sm"><use href="#i-search"/></svg><span>Buscar funcionário, solicitação ou dúvida…</span><kbd>Ctrl K</kbd></button>
    </header>
    <div id="plat-aviso"></div>
    <div class="plat-body" id="plat-body"></div>
  </div>
  <div class="plat-drop" id="plat-drop" hidden><div><b>Solte aqui para o Assistente ler</b>Atestados, documentos, pedidos de demissão, planilhas…<small>O arquivo é lido no seu computador.</small></div></div>
</div>
<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-box" role="dialog" aria-label="Buscar">
    <div class="cmdk-in"><svg class="ic"><use href="#i-search"/></svg><input id="cmdk-q" type="search" placeholder="Buscar funcionário, solicitação, pedido ou dúvida…" autocomplete="off" aria-controls="cmdk-res"><kbd>Esc</kbd></div>
    <div class="cmdk-res" id="cmdk-res" role="listbox"></div>
  </div>
</div>
<div id="print-area" aria-hidden="true"></div>

<input type="file" id="file-input" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff,.xlsx,.xls,.csv,.txt">
<div class="modal" id="modal" hidden></div>
<script type="module" src="panel.js"></script>
</body>
</html>
